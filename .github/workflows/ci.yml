name: Wilotech CI & Security Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Pruebas de Núcleo (Core)
      run: |
        python tests/test_core.py

    - name: Ejecutar Pruebas de Conversión de Moneda
      run: |
        python tests/test_currency_conversion.py

    - name: Ejecutar Pruebas de Filtro de Repuestos
      run: |
        python tests/test_part_matcher.py

    - name: Ejecutar Pruebas de Importador de Catálogos Excel
      run: |
        python tests/test_excel_importer.py

    - name: Ejecutar Suite de Seguridad y Hardening
      run: |
        python tests/test_security_hardening.py
